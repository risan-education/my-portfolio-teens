name: Check documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links, dates and examples
        shell: pwsh
        run: ./scripts/check-docs.ps1
      - name: Exercise validation, save and restore
        shell: pwsh
        run: ./scripts/test-docs.ps1
